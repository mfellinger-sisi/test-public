# Generated by AI Crew (.aicrew/VERSION). It is rewritten when the environments change: do not edit it.
name: aicrew
on:
  - push
  - workflow_dispatch
permissions:
  contents: read
env:
  PROJECT_TYPE: typo3
  PHP_VERSION: ${{ vars.PHP_VERSION || '8.2' }}
  COMPOSER_VERSION: ${{ vars.COMPOSER_VERSION || '2.2.30' }}
  PHP_EXTENSIONS: ${{ vars.PHP_EXTENSIONS || 'gd intl pdo_mysql sodium zip' }}
  PHPSTAN_VERSION: ${{ vars.PHPSTAN_VERSION || '1.12.24' }}
  PHPMD_VERSION: ${{ vars.PHPMD_VERSION || '2.15.0' }}
jobs:
  php_codesniffer:
    name: php-codesniffer
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    continue-on-error: ${{ vars.CHECKS_BLOCK_DEPLOY != '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: phpcs
          coverage: none
      - run: bash .aicrew/server/phpcs.sh
  composer:
    name: composer
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none
      - run: bash .aicrew/server/composer.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      - uses: actions/upload-artifact@v6
        with:
          name: composer
          path: |-
            composer.lock
            Packages/Libraries/
            public/
            vendor/
            web/typo3conf/ext
          if-no-files-found: ignore
          retention-days: 1
  phpmd:
    name: phpmd
    needs:
      - composer
    if: ${{ (vars.USE_PHPMD || '1') != '0' }}
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    continue-on-error: ${{ vars.CHECKS_BLOCK_DEPLOY != '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none
      - uses: actions/download-artifact@v7
        with:
          name: composer
          path: .
        continue-on-error: true
      - run: bash .aicrew/server/phpmd.sh
        env:
          PHPMD_PHAR: ${{ runner.temp }}/phpmd.phar
          USE_PHPMD: ${{ vars.USE_PHPMD }}
  phpstan:
    name: phpstan
    needs:
      - composer
    if: ${{ (vars.USE_PHPSTAN || '1') != '0' }}
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    continue-on-error: ${{ vars.CHECKS_BLOCK_DEPLOY != '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: none
      - uses: actions/download-artifact@v7
        with:
          name: composer
          path: .
        continue-on-error: true
      - run: bash .aicrew/server/phpstan.sh
        env:
          PHPSTAN_PHAR: ${{ runner.temp }}/phpstan.phar
          USE_PHPSTAN: ${{ vars.USE_PHPSTAN }}
  stylelint:
    name: stylelint
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npm install --no-save --no-package-lock stylelint stylelint-config-standard-scss
      - run: PATH="$PWD/node_modules/.bin:$PATH" bash .aicrew/server/stylelint.sh
  deploy_staging:
    name: deploy staging
    needs:
      - php_codesniffer
      - composer
      - phpmd
      - phpstan
      - stylelint
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.ref_name == (vars.DEPLOY_STAGING_BRANCH || 'staging') }}
    runs-on: ${{ vars.AICREW_RUNNER || 'ubuntu-24.04' }}
    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_ROLE: staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy
        run: bash .aicrew/server/deploy-${PROJECT_TYPE}.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AICREW_VARS: ${{ toJSON(vars) }}
          AICREW_SECRETS: ${{ toJSON(secrets) }}
