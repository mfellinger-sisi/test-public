rootPageId: 1
base: /
baseVariants:
  -
    # The staging installation is served from a subdirectory of the document
    # root, which has to be part of the base so that links keep working. The
    # base deliberately contains no domain: the staging host has changed
    # before, and a relative base matches every host (and both http and https)
    # the environment is reachable under.
    base: /github-public-staging/
    condition: 'applicationContext == "Development/staging"'
  -
    # The live installation is served from /github-public-live/ and needs the
    # same relative base (see above). Without this variant TYPO3 only knows
    # the base "/" and answers "Page Not Found" there.
    base: /github-public-live/
    condition: 'applicationContext == "Production/Live"'
websiteTitle: 'signundsinn GmbH'
dependencies:
  - typo3/fluid-styled-content
languages:
  -
    title: Deutsch
    enabled: true
    languageId: 0
    base: /
    locale: de_DE.UTF-8
    navigationTitle: Deutsch
    flag: de
    websiteTitle: 'signundsinn GmbH'
errorHandling: []
routes: []
